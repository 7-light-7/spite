server {
    listen 80;
    root /usr/share/nginx/html;

    # Star responses are a few MB of JSON; gzip takes them down ~4x
    gzip on;
    gzip_proxied any;
    gzip_types application/json;
    gzip_min_length 1024;

    # Same mapping as the Vite dev proxy: /api/stars -> backend /stars
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 120s; # a cold 50-degree disc takes ~20s upstream
    }

    location / {
        try_files $uri /index.html;
    }
}
