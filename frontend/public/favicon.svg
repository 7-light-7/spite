<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .planet { fill: #000; }
    .ring { fill: none; stroke: #000; stroke-width: 2.4; }
    /* a black planet vanishes on a dark tab strip, so follow the system theme there */
    @media (prefers-color-scheme: dark) {
      .planet { fill: #fff; }
      .ring { stroke: #fff; }
    }
  </style>
  <defs>
    <!-- hide the ring near the planet so the two read as separate shapes at 16px -->
    <mask id="gap">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="16" cy="16" r="9" fill="#000"/>
    </mask>
  </defs>
  <circle class="planet" cx="16" cy="16" r="7"/>
  <ellipse class="ring" cx="16" cy="16" rx="14.5" ry="6.5" transform="rotate(-22 16 16)" mask="url(#gap)"/>
</svg>
